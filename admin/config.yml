backend:
  name: git-gateway
  branch: main



publish_mode: editorial_workflow


media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "posts"
    label: "פוסטים"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}.md"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "כותרת", name: "title", widget: "string", required: true }
      - { label: "תאריך פרסום", name: "date", widget: "datetime", required: true }
      - { label: "תמונה ראשית", name: "featured_image", widget: "image", required: false }
      - { label: "פוסט מומלץ?", name: "popular", widget: "boolean", required: false, default: false }
      - { label: "קטגוריות", name: "categories", widget: "list", required: false }
      - { label: "תגיות", name: "tags", widget: "list", required: false }
      - { label: "שם המחבר", name: "author", widget: "string", required: false, default: "nh local" }
      - { label: "גוף הפוסט", name: "body", widget: "markdown", required: true }
  
  - name: "quotes"
    label: "ציטוטים"
    folder: "_quotes"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "quote" }
      - { label: "כותרת (לצורך הקישור והזיהוי)", name: "title", widget: "string", required: true }
      - { label: "תאריך", name: "date", widget: "datetime", required: true }
      - { label: "תוכן הציטוט", name: "quote_text", widget: "markdown", required: true }
      - { label: "דובר / מקור הציטוט", name: "author", widget: "string", required: true }
      - { label: "קישור למקור (אופציונלי)", name: "source_url", widget: "string", required: false }
      - { label: "ציטוט מומלץ?", name: "popular", widget: "boolean", required: false, default: false }