title: "הבלוג של NHLOCAL"
description: "יומן מסע אישי בחזית מהפכת ה-AI"
author: "NH Local"
email: "nh.local11@gmail.com"
keywords: "בינה מלאכותית, AI, מודלי שפה, למידת מכונה, חדשות טכנולוגיה, ג'מיני, GPT, OpenAI, Grok, Claude, DeepSeek, LLM, טכנולוגיה, חדשנות, תכנות, פיתוח"
url: "https://blog.ze-kal.top"
baseurl: ""

lang: "he"
future: true

markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

sass:
  sass_dir: _sass
  style: compressed


include:
  - admin

# הגדרת סוגי תוכן (Collections)
collections:
  quotes:
    output: true
    permalink: /quotes/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "quotes"
    values:
      layout: "quote"

custom_settings:
  profile_image: "https://nhlocal.github.io/NH.LOCAL.jpg"
  posts_per_page_home: 5
  recent_posts_sidebar_count: 5
  popular_posts_sidebar_count: 5
  recent_quotes_sidebar_count: 3


plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-minifier
  - jekyll-sitemap


jekyll-minifier:
  uglifier_args:
    harmony: true

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/