<header class="site-header" id="top" data-pagefind-ignore>
  <div class="header-content">
    <div class="site-branding">
      {% if site.custom_settings.profile_image %}
      <a href="{{ "/" | relative_url }}" class="profile-link">
        <img src="{{ site.custom_settings.profile_image | relative_url }}" alt="תמונת פרופיל" class="profile-image">
      </a>
      {% endif %}
      <div class="site-titles">
        <div class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title | escape }}</a></div>
        {% if site.description %}
        <p class="site-description">{{ site.description | escape }}</p>
        {% endif %}
      </div>
    </div>

    <nav class="site-nav">


        <form class="header-search-form" action="{{ "/search/" | relative_url }}" method="get" role="search">
          <input type="search" name="q" placeholder="חיפוש באתר..." aria-label="חיפוש באתר">
          <button type="submit" aria-label="בצע חיפוש"><i class="bi bi-search"></i></button>
        </form>

        <a href="{{ "/" | relative_url }}">בית</a>
        <a href="{{ "/posts/" | relative_url }}">ארכיון</a>
        <a href="{{ "/recommended/" | relative_url }}">מומלצים</a>
        <a href="{{ "/categories/" | relative_url }}">קטגוריות</a>
        <a href="{{ "/tags/" | relative_url }}">תגיות</a>
        <a href="{{ "/search/" | relative_url }}">חיפוש</a>
        <a href="#" id="feedback-link-header">משוב</a>
        <a href="{{ "/about/" | relative_url }}">אודות</a>
    </nav>

    <button id="menu-toggle" class="menu-toggle-button" aria-label="פתח תפריט" aria-controls="site-nav" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</header>
